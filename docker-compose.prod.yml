services:
  backend:
    image: ghcr.io/oleojake/btd-backend:latest
    container_name: btd_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env

  frontend:
    image: ghcr.io/oleojake/btd-frontend:latest
    container_name: btd_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
