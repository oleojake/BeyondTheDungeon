services:
  frontend:
    build:
      context: ./frontend
    container_name: btd_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: btd_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # luego meteremos aquí SUPABASE_URL, SUPABASE_KEY, etc.
