<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="parchBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f5e9c8"/>
      <stop offset="65%" stop-color="#e8d49e"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </radialGradient>
    <radialGradient id="packGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5e10" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropshadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#4a2a08" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="leatherPack" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c8843a"/>
      <stop offset="100%" stop-color="#7a4010"/>
    </radialGradient>
    <radialGradient id="potionRed" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff8090"/>
      <stop offset="100%" stop-color="#9a1020"/>
    </radialGradient>
    <radialGradient id="potionBlue" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#80b8ff"/>
      <stop offset="100%" stop-color="#102870"/>
    </radialGradient>
  </defs>

  <!-- Parchment background -->
  <rect width="400" height="400" fill="url(#parchBg)"/>

  <!-- Texture lines -->
  <line x1="0" y1="50" x2="400" y2="43" stroke="#c9a96e" stroke-width="0.8" opacity="0.4"/>
  <line x1="0" y1="120" x2="400" y2="113" stroke="#c9a96e" stroke-width="0.6" opacity="0.3"/>
  <line x1="0" y1="340" x2="400" y2="333" stroke="#c9a96e" stroke-width="0.7" opacity="0.35"/>
  <line x1="0" y1="375" x2="400" y2="368" stroke="#c9a96e" stroke-width="0.8" opacity="0.4"/>

  <!-- Torn edges top -->
  <path d="M0,0 Q25,6 50,2 Q80,-1 110,5 Q145,10 175,1 Q205,-3 235,5 Q265,11 295,3 Q325,-2 355,4 Q380,8 400,3 L400,0 Z" fill="#b8955a" opacity="0.45"/>

  <!-- Glow behind pack -->
  <ellipse cx="200" cy="235" rx="110" ry="90" fill="url(#packGlow)"/>

  <!-- =================== BACKPACK =================== -->
  <g filter="url(#dropshadow)">
    <!-- Pack shadow base -->
    <ellipse cx="200" cy="340" rx="80" ry="14" fill="#4a2808" opacity="0.3"/>

    <!-- Main pack body -->
    <rect x="130" y="165" width="140" height="155" rx="18" ry="18" fill="url(#leatherPack)" stroke="#4a2808" stroke-width="2.5"/>

    <!-- Leather stitch lines on pack -->
    <rect x="137" y="172" width="126" height="141" rx="14" fill="none" stroke="#5a3010" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

    <!-- Pack top flap -->
    <path d="M135,192 Q200,155 265,192 L265,210 Q200,180 135,210 Z" fill="#b87030" stroke="#4a2808" stroke-width="2"/>
    <path d="M140,197 Q200,163 260,197" fill="none" stroke="#8a5020" stroke-width="1.5" opacity="0.6"/>

    <!-- Flap buckle -->
    <rect x="183" y="203" width="34" height="18" rx="4" fill="#c8a020" stroke="#7a5a10" stroke-width="1.5"/>
    <rect x="191" y="207" width="18" height="10" rx="2" fill="none" stroke="#7a5a10" stroke-width="1.5"/>
    <line x1="200" y1="207" x2="200" y2="217" stroke="#7a5a10" stroke-width="1.5"/>

    <!-- Front pocket -->
    <rect x="148" y="260" width="104" height="50" rx="10" fill="#a06020" stroke="#4a2808" stroke-width="2"/>
    <rect x="153" y="265" width="94" height="40" rx="8" fill="none" stroke="#5a3010" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <!-- Pocket buckle -->
    <rect x="183" y="275" width="34" height="14" rx="3" fill="#c8a020" stroke="#7a5a10" stroke-width="1.5"/>
    <rect x="190" y="278" width="20" height="8" rx="2" fill="none" stroke="#7a5a10" stroke-width="1.5"/>

    <!-- Side straps -->
    <path d="M132,200 L120,230 L118,290 L130,295 L138,240 L140,210 Z" fill="#b87030" stroke="#4a2808" stroke-width="1.5"/>
    <path d="M268,200 L280,230 L282,290 L270,295 L262,240 L260,210 Z" fill="#b87030" stroke="#4a2808" stroke-width="1.5"/>

    <!-- Strap buckles side -->
    <rect x="115" y="255" width="22" height="14" rx="3" fill="#c8a020" stroke="#7a5a10" stroke-width="1.5"/>
    <rect x="263" y="255" width="22" height="14" rx="3" fill="#c8a020" stroke="#7a5a10" stroke-width="1.5"/>

    <!-- Pack top handle -->
    <path d="M175,165 Q200,148 225,165" fill="none" stroke="#8b5220" stroke-width="8" stroke-linecap="round"/>
    <path d="M175,165 Q200,148 225,165" fill="none" stroke="#c87838" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ========= Items sticking out of pack top ========= -->

  <!-- Rolled scroll sticking up left -->
  <g transform="translate(148, 160) rotate(-15)">
    <rect x="-7" y="-45" width="14" height="55" rx="3" fill="#f0e0b0" stroke="#8b6030" stroke-width="1.5"/>
    <circle cx="0" cy="-45" r="5" fill="#d4b070" stroke="#8b6030" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="5" fill="#d4b070" stroke="#8b6030" stroke-width="1.5"/>
    <line x1="-4" y1="-35" x2="4" y2="-35" stroke="#8b6030" stroke-width="1" opacity="0.5"/>
    <line x1="-4" y1="-25" x2="4" y2="-25" stroke="#8b6030" stroke-width="1" opacity="0.5"/>
    <line x1="-4" y1="-15" x2="4" y2="-15" stroke="#8b6030" stroke-width="1" opacity="0.5"/>
    <line x1="-4" y1="-5" x2="4" y2="-5" stroke="#8b6030" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Sword handle sticking up right -->
  <g transform="translate(258, 155) rotate(10)">
    <!-- Blade (barely visible) -->
    <rect x="-3" y="-50" width="6" height="45" rx="1" fill="#c8d8e8" stroke="#607080" stroke-width="1"/>
    <!-- Guard crosspiece -->
    <rect x="-16" y="-10" width="32" height="7" rx="3" fill="#c8a020" stroke="#7a5010" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="-5" y="-5" width="10" height="26" rx="3" fill="#8b4510" stroke="#5a2808" stroke-width="1.5"/>
    <!-- Handle wrap lines -->
    <line x1="-4" y1="3" x2="4" y2="3" stroke="#c8a020" stroke-width="1" opacity="0.7"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="#c8a020" stroke-width="1" opacity="0.7"/>
    <line x1="-4" y1="15" x2="4" y2="15" stroke="#c8a020" stroke-width="1" opacity="0.7"/>
    <!-- Pommel -->
    <circle cx="0" cy="24" r="7" fill="#c8a020" stroke="#7a5010" stroke-width="1.5"/>
    <circle cx="0" cy="24" r="3" fill="#e8c040" opacity="0.7"/>
  </g>

  <!-- Health potion (red) hanging on side -->
  <g transform="translate(105, 255)">
    <!-- Bottle -->
    <path d="M-6,0 L-8,15 Q-8,30 0,30 Q8,30 8,15 L6,0 Z" fill="url(#potionRed)" stroke="#6a0818" stroke-width="1.5"/>
    <!-- Neck -->
    <rect x="-4" y="-12" width="8" height="14" rx="2" fill="#c84050" stroke="#6a0818" stroke-width="1.5"/>
    <!-- Cork -->
    <rect x="-3" y="-16" width="6" height="6" rx="2" fill="#c8a060" stroke="#7a5828" stroke-width="1.5"/>
    <!-- Shine -->
    <line x1="-4" y1="5" x2="-2" y2="20" stroke="#ffaaaa" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <!-- Label line -->
    <line x1="-5" y1="18" x2="5" y2="18" stroke="#6a0818" stroke-width="1" opacity="0.4"/>
    <!-- Hang cord -->
    <path d="M0,-16 Q-12,-22 -15,-30" fill="none" stroke="#8b6030" stroke-width="1.5"/>
  </g>

  <!-- Mana potion (blue) hanging on other side -->
  <g transform="translate(295, 265)">
    <path d="M-6,0 L-8,15 Q-8,30 0,30 Q8,30 8,15 L6,0 Z" fill="url(#potionBlue)" stroke="#081850" stroke-width="1.5"/>
    <rect x="-4" y="-12" width="8" height="14" rx="2" fill="#2050b8" stroke="#081850" stroke-width="1.5"/>
    <rect x="-3" y="-16" width="6" height="6" rx="2" fill="#c8a060" stroke="#7a5828" stroke-width="1.5"/>
    <line x1="-4" y1="5" x2="-2" y2="20" stroke="#aad0ff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <path d="M0,-16 Q12,-22 15,-30" fill="none" stroke="#8b6030" stroke-width="1.5"/>
  </g>

  <!-- Gem/orb on ground near pack -->
  <g transform="translate(165, 330)">
    <ellipse cx="0" cy="8" rx="10" ry="4" fill="#3a2008" opacity="0.3"/>
    <circle cx="0" cy="0" r="12" fill="#20a844" stroke="#0a5c22" stroke-width="2"/>
    <circle cx="-3" cy="-4" r="5" fill="#60e890" opacity="0.6"/>
    <circle cx="-5" cy="-5" r="2" fill="#c0ffda" opacity="0.8"/>
  </g>

  <!-- Coins scattered -->
  <ellipse cx="230" cy="337" rx="14" ry="9" fill="#d4a520" stroke="#8b6914" stroke-width="1.5" transform="rotate(10,230,337)"/>
  <ellipse cx="250" cy="330" rx="13" ry="8" fill="#e8c030" stroke="#8b6914" stroke-width="1.5" transform="rotate(-5,250,330)"/>
  <ellipse cx="215" cy="335" rx="11" ry="7" fill="#d4a520" stroke="#8b6914" stroke-width="1.5" transform="rotate(20,215,335)"/>

  <!-- Sparkles -->
  <g opacity="0.85">
    <path d="M165,130 L167,136 L173,136 L168,139.5 L170,146 L165,142 L160,146 L162,139.5 L157,136 L163,136 Z" fill="#ffd700" stroke="#c8a000" stroke-width="0.5"/>
    <path d="M240,140 L241.5,145 L247,145 L242.5,148 L244,153 L240,150 L236,153 L237.5,148 L233,145 L238.5,145 Z" fill="#ffd700" stroke="#c8a000" stroke-width="0.5"/>
    <circle cx="290" cy="190" r="2" fill="#ffd700" opacity="0.9"/>
    <circle cx="115" cy="210" r="1.5" fill="#ffd700" opacity="0.8"/>
    <circle cx="310" cy="155" r="2" fill="#ffd700" opacity="0.7"/>
    <circle cx="140" cy="300" r="1.5" fill="#ffd700" opacity="0.7"/>
  </g>

  <!-- Title scroll banner -->
  <path d="M55,70 Q90,58 200,62 Q310,58 345,70 Q310,85 200,82 Q90,85 55,70 Z" fill="#e8d49e" stroke="#8b6030" stroke-width="2" opacity="0.9"/>
  <path d="M55,70 Q50,76 55,82 Q90,90 200,86 Q310,90 345,82 Q350,76 345,70" fill="#d4b878" stroke="#8b6030" stroke-width="1.5" opacity="0.7"/>
  <text x="200" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5a3010" letter-spacing="1">INVENTARIO</text>

  <!-- Decorative corners -->
  <path d="M15,15 L50,15 M15,15 L15,50" stroke="#8b6030" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="15" cy="15" r="5" fill="none" stroke="#8b6030" stroke-width="1.5" opacity="0.5"/>
  <path d="M385,15 L350,15 M385,15 L385,50" stroke="#8b6030" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="385" cy="15" r="5" fill="none" stroke="#8b6030" stroke-width="1.5" opacity="0.5"/>
  <path d="M15,385 L50,385 M15,385 L15,350" stroke="#8b6030" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M385,385 L350,385 M385,385 L385,350" stroke="#8b6030" stroke-width="2" fill="none" opacity="0.5"/>
</svg>